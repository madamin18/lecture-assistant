name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests use a fake embedder and a fake AI client, so they need neither
      # sentence-transformers (and PyTorch) nor an API key.
      - run: pip install pymupdf numpy openai python-dotenv pytest
      - run: pytest -q
